<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#2563eb"/>
  <!-- Test tube -->
  <g transform="translate(160, 80)">
    <rect x="30" y="0" width="60" height="20" rx="4" fill="#fff" opacity="0.9"/>
    <rect x="36" y="20" width="48" height="200" rx="4" fill="#fff" opacity="0.9"/>
    <path d="M36,220 L36,280 Q36,320 60,320 Q84,320 84,280 L84,220 Z" fill="#fff" opacity="0.9"/>
    <!-- Liquid in tube -->
    <path d="M42,200 L42,275 Q42,310 60,310 Q78,310 78,275 L78,200 Z" fill="#93c5fd" opacity="0.8"/>
    <!-- Measurement lines -->
    <line x1="36" y1="80" x2="50" y2="80" stroke="#2563eb" stroke-width="3"/>
    <line x1="36" y1="120" x2="50" y2="120" stroke="#2563eb" stroke-width="3"/>
    <line x1="36" y1="160" x2="50" y2="160" stroke="#2563eb" stroke-width="3"/>
  </g>
  <!-- Clock -->
  <g transform="translate(310, 260)">
    <circle cx="60" cy="60" r="58" fill="#fff" opacity="0.9"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#2563eb" stroke-width="4"/>
    <circle cx="60" cy="60" r="4" fill="#2563eb"/>
    <!-- Hour hand -->
    <line x1="60" y1="60" x2="60" y2="30" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="60" y1="60" x2="85" y2="50" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <!-- Hour marks -->
    <line x1="60" y1="14" x2="60" y2="22" stroke="#2563eb" stroke-width="3"/>
    <line x1="60" y1="98" x2="60" y2="106" stroke="#2563eb" stroke-width="3"/>
    <line x1="14" y1="60" x2="22" y2="60" stroke="#2563eb" stroke-width="3"/>
    <line x1="98" y1="60" x2="106" y2="60" stroke="#2563eb" stroke-width="3"/>
  </g>
</svg>
